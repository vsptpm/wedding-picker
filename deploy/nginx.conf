# /etc/nginx/sites-available/wedding-picker  →  ln -s into sites-enabled
# HTTPS uses a Let's Encrypt certificate for the server's IP address (short-lived, auto-renewed by certbot):
#   sudo certbot certonly --webroot -w /var/www/letsencrypt --ip-address <IP> --preferred-profile shortlived \
#     --cert-name wedding-ip --deploy-hook "systemctl reload nginx" --agree-tos --register-unsafely-without-email
# With a domain instead, use -d photos.example.com and change server_name.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt verification (renewals use this too)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;      # nginx 1.24 syntax; 1.25+ prefers "http2 on;"
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/wedding-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wedding-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
}
